name: Overnight Build

# Runs every night at 02:00 UTC (≈ 10:00 PM ET / 9:00 PM CT / 7:00 PM PT).
# Also available for manual runs from the Actions tab.
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  overnight-tests:
    name: Overnight Playwright Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: true

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: overnight-playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: overnight-test-results-${{ github.run_id }}
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
